services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - shield_db:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/shield.db
      - JWT_SECRET=${JWT_SECRET:-change-me-in-.env}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - USE_MOCK_AI=${USE_MOCK_AI:-false}
      - FRONTEND_ORIGIN=http://localhost:3000

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  shield_db:
