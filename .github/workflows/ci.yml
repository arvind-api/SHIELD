name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  env-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no real .env file is committed
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.local)?$'; then
            echo "::error::A real .env file is tracked in git. Only .env.example / .env.local.example should be committed."
            exit 1
          fi
      - name: Ensure .env.example files exist
        run: |
          test -f .env.example
          test -f frontend/.env.local.example

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
